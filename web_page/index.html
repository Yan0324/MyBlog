<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyan | A better day</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;700&family=Fira+Code:wght@300;400;500&family=Permanent+Marker&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 动态粒子画布 -->
    <canvas id="particle-canvas" class="particle-overlay"></canvas>

    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="container nav-container">
            <ul class="nav-menu">
                <li class="nav-item"><a href="#home" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="#about" class="nav-link">About</a></li>
                <li class="nav-item"><a href="#projects" class="nav-link">Projects</a></li>
                <li class="nav-item"><a href="#contact" class="nav-link">Contact</a></li>
                <li class="nav-item">
                    <button id="theme-toggle" class="theme-btn">
                        <i class="fas fa-moon"></i>
                    </button>
                </li>
            </ul>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main id="home" class="main-content">
        <div class="content-wrapper">
            <!-- Logo区域 -->
            <div class="logo-section">
                <h1 class="brand-logo">DMEGO</h1>
                <p class="brand-subtitle">A better day when night belongs to dawn</p>
            </div>

            <!-- 头像区域 -->
            <div class="avatar-section">
                <div class="avatar-container">
                    <img src="assets/images/logo.png" alt="Avatar" class="avatar-img">
                </div>
            </div>

            <!-- 年度关键词与状态 -->
            <div class="status-section">
                <div class="keyword">Be Rich</div>
                <div class="status-line">2026 &middot; 平静</div>
            </div>

            <!-- 分隔线 -->
            <div class="separator">
                <div class="line-draw"></div>
            </div>

            <!-- 引用区 -->
            <div class="quote-section">
                <p class="quote-text" id="typewriter-text" data-text="「如何得与凉风约，不共尘沙一并来！」"></p>
                <p class="quote-source">&mdash; 「中牟道中」</p>
            </div>
        </div>
    </main>

    <!-- 简化的页脚 -->
    <footer class="footer">
        <p>&copy; 2026 Cyan. All Rights Reserved.</p>
    </footer>

    <!-- JavaScript -->
    <script src="js/script.js"></script>
</body>
</html>
